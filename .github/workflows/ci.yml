name: ci

on:
  push:
    branches: [main, dev/1.0.0]
  pull_request:

jobs:
  frontend:
    name: Visualize presentation helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/visualize/model.test.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e '.[dev,dsh,pi]'
      - name: configure git identity (snapshot tests)
        run: |
          git config --global user.email ci@proteus
          git config --global user.name proteus-ci
      - name: lint
        run: ruff check .
      - name: tests
        run: pytest tests/ -q
      - name: offline runner (the no-pytest path must stay alive)
        run: python tests/run_offline.py

  distribution:
    name: Installed wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build==1.3.0
      - run: python -m build
      - name: Wheel scaffolder works outside the checkout
        run: |
          python -m venv /tmp/proteus-wheel
          /tmp/proteus-wheel/bin/pip install --disable-pip-version-check --no-deps dist/*.whl
          mkdir /tmp/proteus-wheel-out
          cp recipes/examples/p01-contract.toml /tmp/proteus-wheel-out/recipe.toml
          cp recipes/examples/self-evaluation.toml /tmp/proteus-wheel-out/self-evaluation.toml
          cd /tmp/proteus-wheel-out
          /tmp/proteus-wheel/bin/python -c 'import importlib.metadata, proteus; assert importlib.metadata.version("proteus-evolve") == proteus.__version__'
          /tmp/proteus-wheel/bin/python -m proteus.scaffold adapter WheelHarness
          /tmp/proteus-wheel/bin/proteus check --harness wheel:WheelHarness --episode
          /tmp/proteus-wheel/bin/proteus visualize --help
          /tmp/proteus-wheel/bin/python -c 'from proteus.recipes import RecipeConfig, load_recipe; recipe = load_recipe("recipe.toml"); assert RecipeConfig.from_json(recipe.to_json()) == recipe'
          /tmp/proteus-wheel/bin/proteus recipe lock self-evaluation.toml --plugin proteus.examples.self_evaluator_plugin:register --source "proteus=$GITHUB_WORKSPACE" --out self-evaluation.lock.json
          /tmp/proteus-wheel/bin/proteus recipe run self-evaluation.toml --plugin proteus.examples.self_evaluator_plugin:register --lock self-evaluation.lock.json --out self-evaluation-run
          /tmp/proteus-wheel/bin/python -m proteus.examples.candidate_evaluation --out candidate-study
          /tmp/proteus-wheel/bin/proteus recipe lock candidate-study/recipe.json --source "proteus=$GITHUB_WORKSPACE" --out candidate-study/lock.json
          /tmp/proteus-wheel/bin/proteus recipe run candidate-study/recipe.json --lock candidate-study/lock.json --artifact-store candidate-study/artifact-store --out candidate-study/run
          /tmp/proteus-wheel/bin/python -c 'import json; from pathlib import Path; from proteus.core.contracts import EvaluationBatch; r=json.loads(Path("candidate-study/run/execution-0001.json").read_text()); assert [EvaluationBatch.from_dict(b).mean_score() for b in r["evaluations"]] == [0, 1]; assert len(r["rollouts"]) == 6'
          /tmp/proteus-wheel/bin/python -c 'from pathlib import Path; from proteus.visualize import server; assert all((Path(server.__file__).parent / "static" / name).is_file() for name, kind in server.ASSETS.values())'
      - name: Sdist scaffolder works outside the checkout
        run: |
          python -m venv /tmp/proteus-sdist
          /tmp/proteus-sdist/bin/pip install --disable-pip-version-check --no-deps dist/*.tar.gz
          mkdir /tmp/proteus-sdist-out
          cp recipes/examples/p01-contract.toml /tmp/proteus-sdist-out/recipe.toml
          cp recipes/native/minimal.toml /tmp/proteus-sdist-out/native.toml
          cd /tmp/proteus-sdist-out
          /tmp/proteus-sdist/bin/python -m proteus.scaffold benchmark package_task
          /tmp/proteus-sdist/bin/python -c 'import package_task; assert package_task.TASK.id == "package_task"'
          /tmp/proteus-sdist/bin/proteus visualize --help
          /tmp/proteus-sdist/bin/python -c 'from proteus.recipes import RecipeConfig, load_recipe; recipe = load_recipe("recipe.toml"); assert RecipeConfig.from_json(recipe.to_json()) == recipe'
          /tmp/proteus-sdist/bin/proteus recipe lock native.toml --source "proteus=$GITHUB_WORKSPACE" --out native.lock.json
          /tmp/proteus-sdist/bin/proteus recipe run native.toml --lock native.lock.json --out native-run
          /tmp/proteus-sdist/bin/proteus recipe resume native.toml --lock native.lock.json --out native-run
          /tmp/proteus-sdist/bin/python -m proteus.examples.candidate_evaluation --out candidate-study
          /tmp/proteus-sdist/bin/proteus recipe lock candidate-study/recipe.json --source "proteus=$GITHUB_WORKSPACE" --out candidate-study/lock.json
          /tmp/proteus-sdist/bin/proteus recipe run candidate-study/recipe.json --lock candidate-study/lock.json --artifact-store candidate-study/artifact-store --out candidate-study/run
          /tmp/proteus-sdist/bin/python -c 'import json; from pathlib import Path; from proteus.core.contracts import EvaluationBatch; r=json.loads(Path("candidate-study/run/execution-0001.json").read_text()); assert [EvaluationBatch.from_dict(b).mean_score() for b in r["evaluations"]] == [0, 1]; assert len(r["rollouts"]) == 6'
          /tmp/proteus-sdist/bin/python -c 'from pathlib import Path; from proteus.visualize import server; assert all((Path(server.__file__).parent / "static" / name).is_file() for name, kind in server.ASSETS.values())'

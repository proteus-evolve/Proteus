name: ci

on:
  push:
    branches: [main, dev/1.0.0]
  pull_request:

jobs:
  frontend:
    name: Visualize presentation helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/visualize/model.test.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e '.[dev,dsh,pi]'
      - name: Install exact optional GEPA reference for conformance tests
        run: pip install --no-deps 'gepa @ git+https://github.com/gepa-ai/gepa.git@8b0ce6cd99a234f6b74daf37558a2ac0ce18f975'
      - name: Fetch pinned ACE source for playbook and full-method conformance (no SDK imports)
        run: |
          git init /tmp/proteus-ace-reference
          git -C /tmp/proteus-ace-reference remote add origin https://github.com/ace-agent/ace.git
          git -C /tmp/proteus-ace-reference fetch --depth=1 origin 82709de050e1db6e6ef2f07bcb0393560b94992a
          git -C /tmp/proteus-ace-reference checkout --detach FETCH_HEAD
      - name: configure git identity (snapshot tests)
        run: |
          git config --global user.email ci@proteus
          git config --global user.name proteus-ci
      - name: lint
        run: ruff check .
      - name: tests
        env:
          PROTEUS_REQUIRE_GEPA: "1"
          PROTEUS_ACE_SOURCE: /tmp/proteus-ace-reference
        run: pytest tests/ -q
      - name: offline runner (the no-pytest path must stay alive)
        run: python tests/run_offline.py

  aime-reference:
    name: Pinned AIME data and DSPy contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated domain reference (DSPy owns a different GEPA dependency)
        run: |
          pip install -e . 'pyarrow==21.0.0'
          pip install 'https://files.pythonhosted.org/packages/ad/2f/656f16206c9ba4e359b639e2605cf196a4e5c678c6d9aed0fae537701ec2/dspy-3.4.1-py3-none-any.whl#sha256=afda9e7f8b3d46be0829af19ac1153a6feaa6db5923f2b1011eef547fb15ce2d'
      - name: Check actual reference formatting and metric without inference
        run: |
          git init /tmp/aime-gepa-reference
          git -C /tmp/aime-gepa-reference remote add origin https://github.com/gepa-ai/gepa.git
          git -C /tmp/aime-gepa-reference fetch --depth=1 origin 8b0ce6cd99a234f6b74daf37558a2ac0ce18f975
          git -C /tmp/aime-gepa-reference checkout --detach FETCH_HEAD
          python tests/check_aime_reference.py --gepa-source /tmp/aime-gepa-reference
      - name: Verify all pinned public dataset bytes and the full 45/45/30 split
        run: python -m proteus.benchmarks.aime_data --cache /tmp/aime-source-cache --out /tmp/aime-pinned-data
      - uses: actions/upload-artifact@v4
        with:
          name: aime-data-provenance
          path: /tmp/aime-pinned-data/provenance.json

  distribution:
    name: Installed wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build==1.3.0
      - run: python -m build
      - name: Wheel scaffolder works outside the checkout
        run: |
          python -m venv /tmp/proteus-wheel
          /tmp/proteus-wheel/bin/pip install --disable-pip-version-check --no-deps dist/*.whl
          mkdir /tmp/proteus-wheel-out
          cp recipes/examples/p01-contract.toml /tmp/proteus-wheel-out/recipe.toml
          cp recipes/examples/self-evaluation.toml /tmp/proteus-wheel-out/self-evaluation.toml
          cp tests/check_ace_package.py /tmp/proteus-wheel-out/check_ace_package.py
          cd /tmp/proteus-wheel-out
          /tmp/proteus-wheel/bin/python check_ace_package.py
          /tmp/proteus-wheel/bin/python -c 'import importlib.metadata, proteus; assert importlib.metadata.version("proteus-evolve") == proteus.__version__'
          /tmp/proteus-wheel/bin/python -m proteus.scaffold adapter WheelHarness
          /tmp/proteus-wheel/bin/proteus check --harness wheel:WheelHarness --episode
          /tmp/proteus-wheel/bin/proteus visualize --help
          /tmp/proteus-wheel/bin/python -c 'from proteus.recipes import RecipeConfig, load_recipe; recipe = load_recipe("recipe.toml"); assert RecipeConfig.from_json(recipe.to_json()) == recipe'
          /tmp/proteus-wheel/bin/proteus recipe lock self-evaluation.toml --plugin proteus.examples.self_evaluator_plugin:register --source "proteus=$GITHUB_WORKSPACE" --out self-evaluation.lock.json
          /tmp/proteus-wheel/bin/proteus recipe run self-evaluation.toml --plugin proteus.examples.self_evaluator_plugin:register --lock self-evaluation.lock.json --out self-evaluation-run
          /tmp/proteus-wheel/bin/python -m proteus.examples.candidate_evaluation --out candidate-study
          /tmp/proteus-wheel/bin/proteus recipe lock candidate-study/recipe.json --source "proteus=$GITHUB_WORKSPACE" --out candidate-study/lock.json
          /tmp/proteus-wheel/bin/proteus recipe run candidate-study/recipe.json --lock candidate-study/lock.json --artifact-store candidate-study/artifact-store --out candidate-study/run
          /tmp/proteus-wheel/bin/python -c 'import json; from pathlib import Path; from proteus.core.contracts import EvaluationBatch; r=json.loads(Path("candidate-study/run/execution-0001.json").read_text()); assert [EvaluationBatch.from_dict(b).mean_score() for b in r["evaluations"]] == [0, 1]; assert len(r["rollouts"]) == 6'
          /tmp/proteus-wheel/bin/python -c 'from pathlib import Path; from proteus.core.ledger import Ledger; from proteus.recipes.manifest import RunManifest; root=Path("candidate-study/run"); m=RunManifest.from_json((root/"manifest.json").read_text()); book=Ledger(root/"private/ledger.sqlite3", run_id=m.run_id, config_hash=m.config_hash, lock_hash=m.lock_hash); assert book.balance()["charged"]["evaluations"] == 6; assert all(e["state"] == "completed" for e in book.entries())'
          /tmp/proteus-wheel/bin/python -c 'from pathlib import Path; from proteus.visualize import server; assert all((Path(server.__file__).parent / "static" / name).is_file() for name, kind in server.ASSETS.values())'
      - name: Installed wheel runs the pinned GEPA method outside the checkout
        run: |
          /tmp/proteus-wheel/bin/pip install --no-deps 'gepa @ git+https://github.com/gepa-ai/gepa.git@8b0ce6cd99a234f6b74daf37558a2ac0ce18f975'
          cd /tmp/proteus-wheel-out
          /tmp/proteus-wheel/bin/python -m proteus.examples.gepa_prompt --out gepa-study
          /tmp/proteus-wheel/bin/proteus recipe lock gepa-study/recipe.json --plugin proteus.methods.gepa.method:register --plugin proteus.examples.gepa_prompt:register --source "proteus=$GITHUB_WORKSPACE" --out gepa-study/lock.json
          /tmp/proteus-wheel/bin/proteus recipe run gepa-study/recipe.json --plugin proteus.methods.gepa.method:register --plugin proteus.examples.gepa_prompt:register --lock gepa-study/lock.json --artifact-store gepa-study/artifact-store --out gepa-study/run
          /tmp/proteus-wheel/bin/proteus recipe resume gepa-study/recipe.json --plugin proteus.methods.gepa.method:register --plugin proteus.examples.gepa_prompt:register --lock gepa-study/lock.json --out gepa-study/run
          /tmp/proteus-wheel/bin/python -c 'import json; from pathlib import Path; p=Path("gepa-study/run"); assert json.loads((p/"result.json").read_text())["status"]=="completed"; r=json.loads((p/"execution-0002.json").read_text()); s=next(x["value"] for x in r["values"] if x["ref"]["kind"]=="proteus.gepa.summary@1"); assert s["metric_calls"]==10 and s["reflection_calls"]==1; assert len(r["rollouts"])==12 and len(r["actor_calls"])==13; assert sum(len(x.read_text().splitlines()) for x in p.rglob("fixture-invocations.txt"))==13'
      - name: Sdist scaffolder works outside the checkout
        run: |
          python -m venv /tmp/proteus-sdist
          /tmp/proteus-sdist/bin/pip install --disable-pip-version-check --no-deps dist/*.tar.gz
          mkdir /tmp/proteus-sdist-out
          cp recipes/examples/p01-contract.toml /tmp/proteus-sdist-out/recipe.toml
          cp recipes/native/minimal.toml /tmp/proteus-sdist-out/native.toml
          cp tests/check_ace_package.py /tmp/proteus-sdist-out/check_ace_package.py
          cd /tmp/proteus-sdist-out
          /tmp/proteus-sdist/bin/python check_ace_package.py
          /tmp/proteus-sdist/bin/python -m proteus.scaffold benchmark package_task
          /tmp/proteus-sdist/bin/python -c 'import package_task; assert package_task.TASK.id == "package_task"'
          /tmp/proteus-sdist/bin/proteus visualize --help
          /tmp/proteus-sdist/bin/python -c 'from proteus.recipes import RecipeConfig, load_recipe; recipe = load_recipe("recipe.toml"); assert RecipeConfig.from_json(recipe.to_json()) == recipe'
          /tmp/proteus-sdist/bin/proteus recipe lock native.toml --source "proteus=$GITHUB_WORKSPACE" --out native.lock.json
          /tmp/proteus-sdist/bin/proteus recipe run native.toml --lock native.lock.json --out native-run
          /tmp/proteus-sdist/bin/proteus recipe resume native.toml --lock native.lock.json --out native-run
          /tmp/proteus-sdist/bin/python -m proteus.examples.candidate_evaluation --out candidate-study
          /tmp/proteus-sdist/bin/proteus recipe lock candidate-study/recipe.json --source "proteus=$GITHUB_WORKSPACE" --out candidate-study/lock.json
          /tmp/proteus-sdist/bin/proteus recipe run candidate-study/recipe.json --lock candidate-study/lock.json --artifact-store candidate-study/artifact-store --out candidate-study/run
          /tmp/proteus-sdist/bin/python -c 'import json; from pathlib import Path; from proteus.core.contracts import EvaluationBatch; r=json.loads(Path("candidate-study/run/execution-0001.json").read_text()); assert [EvaluationBatch.from_dict(b).mean_score() for b in r["evaluations"]] == [0, 1]; assert len(r["rollouts"]) == 6'
          /tmp/proteus-sdist/bin/python -c 'from pathlib import Path; from proteus.core.ledger import Ledger; from proteus.recipes.manifest import RunManifest; root=Path("candidate-study/run"); m=RunManifest.from_json((root/"manifest.json").read_text()); book=Ledger(root/"private/ledger.sqlite3", run_id=m.run_id, config_hash=m.config_hash, lock_hash=m.lock_hash); assert book.balance()["charged"]["evaluations"] == 6; assert all(e["state"] == "completed" for e in book.entries())'
          /tmp/proteus-sdist/bin/python -c 'from pathlib import Path; from proteus.visualize import server; assert all((Path(server.__file__).parent / "static" / name).is_file() for name, kind in server.ASSETS.values())'

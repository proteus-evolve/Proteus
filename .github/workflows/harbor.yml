name: Harbor integration

on:
  pull_request:
  push:
    branches: [main, dev/1.0.0]
    tags: ["v*"]

jobs:
  docker:
    name: Pinned Harbor and real Docker trials
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - uses: actions/checkout@v4
        with:
          repository: harbor-framework/harbor
          ref: b53b8134e1241686dca7759af188f987ecc48e8b
          path: .harbor-runtime-src
      - name: Install isolated locked Harbor runtime
        working-directory: .harbor-runtime-src
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/proteus-harbor
        run: uv sync --frozen --no-dev --no-editable --python 3.12
      - run: python -m pip install -e '.[dev]'
      - name: Persistent research workers, native sessions and shared knowledge
        env:
          PROTEUS_HARBOR_PYTHON: ${{ runner.temp }}/proteus-harbor/bin/python
          PROTEUS_HARBOR_STUDY: ${{ runner.temp }}/proteus-worker-study
        run: python -m pytest tests/test_v1_harbor_workers.py -k live_harbor -q
      - name: Real candidate loading, independent verifier and cleanup
        env:
          PROTEUS_HARBOR_PYTHON: ${{ runner.temp }}/proteus-harbor/bin/python
          PROTEUS_HARBOR_STUDY: ${{ runner.temp }}/proteus-harbor-study
        run: python -m pytest tests/test_v1_harbor.py tests/test_v1_source_build.py tests/test_v1_recovery.py tests/test_v1_release_recovery.py tests/test_v1_harbor_code.py tests/test_v1_filesystem_policy.py tests/test_v1_workspace.py tests/test_v1_meta_harness.py tests/test_v1_parallel_evaluation.py tests/test_v1_gateway_harbor.py -k 'live_harbor or live_workspace_docker' -q
      - name: Original CORAL circle packing with independent geometry verification
        env:
          PROTEUS_HARBOR_PYTHON: ${{ runner.temp }}/proteus-harbor/bin/python
          PROTEUS_HARBOR_STUDY: ${{ runner.temp }}/proteus-harbor-study
        run: python -m pytest tests/test_v1_coral_circle_packing.py -k live_harbor -q
      - name: Complete CORAL controller with container workers and original packing task
        env:
          PROTEUS_HARBOR_PYTHON: ${{ runner.temp }}/proteus-harbor/bin/python
          PROTEUS_HARBOR_STUDY: ${{ runner.temp }}/proteus-harbor-study
        run: python -m pytest tests/test_v1_coral_harbor_study.py -k live_harbor -q
      - name: Collect independent worker evidence without pre-populating the baseline study
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          source, destination = temporary/'proteus-worker-study', temporary/'proteus-harbor-study'
          destination.mkdir(parents=True, exist_ok=True)
          if source.exists():
              for child in source.iterdir():
                  target = destination/child.name
                  assert not target.exists(), 'evidence directory collision'
                  shutil.move(str(child), str(target))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-trial-evidence
          path: ${{ runner.temp }}/proteus-harbor-study
          include-hidden-files: true
          retention-days: 14

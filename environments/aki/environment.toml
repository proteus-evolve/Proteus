# Aki research harness. The image is assembled from the (private) research checkout by its
# own scrubbing pipeline; this manifest declares how episodes run once it exists.
[environment]
name = "aki"
image = "proteus-env-aki-src:0.1.0"
network = "none"
memory = "4g"
cpus = 2.0
env_passthrough = []
user = "host"

[harness]
adapter = "aki"
workspace_mount = "/run"
